# Local development stack: every backing service the api and worker need.
# Development only — the production file (memory limits, Caddy, backups) comes later.
#
#   docker compose up -d --wait   start and wait until everything is healthy
#   docker compose down           stop (data kept)
#   docker compose down -v        stop and delete all data volumes
#
# Values come from .env when present (see .env.example); the defaults below match it.
# Every port is published on 127.0.0.1 only.

name: ats

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats}
      POSTGRES_DB: ${POSTGRES_DB:-ats}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-ats_test}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Checks the test database so "healthy" also means the init script has finished.
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_TEST_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  versitygw:
    image: versity/versitygw:v1.9.0
    restart: unless-stopped
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_PORT: ':7070'
      VGW_HEALTH: /health
      VGW_REGION: ${S3_REGION:-us-east-1}
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ats-dev-access-key}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ats-dev-secret-key}
      VGW_QUIET: 'true'
      S3_BUCKET: ${S3_BUCKET:-ats-dev}
    # Wraps the image entrypoint to create the bucket (a directory under /data) on start.
    entrypoint: ['/bin/sh', '/ats/entrypoint.sh']
    ports:
      - 127.0.0.1:${S3_PORT:-7070}:7070
    volumes:
      - versitygw-data:/data
      - ./docker/versitygw/entrypoint.sh:/ats/entrypoint.sh:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:7070/health']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - 127.0.0.1:${SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.37.0
    restart: unless-stopped
    ports:
      - 127.0.0.1:${DOCLING_PORT:-5001}:5001
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  postgres-data:
  redis-data:
  versitygw-data:
