# Lint, typecheck, unit tests and build on every PR and every push to main.
# Playwright E2E against the Compose services in its own job.
# Docker images are built (not pushed) and smoke-tested in the `images` job.
# Integration jobs and deploy are added by their own issues (decisions §14).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per branch (PR head ref, or the pushed ref); a newer push cancels the older run.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API worker tests run real BullMQ jobs, so they need a live Redis (same image as docker-compose.yml).
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No `version` input: pnpm is taken from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # docling-serve is left out: nothing under test calls it yet and its image is several GB.
      - name: Start Compose services
        run: docker compose up -d --wait postgres redis versitygw mailpit

      - name: Install Playwright Chromium
        run: pnpm --filter @ats/web exec playwright install --with-deps chromium

      # playwright.config.ts builds and starts the API, then the web dev server, against the services above.
      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose services
        if: always()
        run: docker compose down -v

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Built and loaded into the runner's Docker only; pushing to a registry is the deploy issue (roadmap step 17).
      # Layers are cached in the GitHub Actions cache, one scope per image.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ats-api:ci
          load: true
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          tags: ats-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Start containers
        run: |
          docker network create ats-ci
          docker run -d --name redis --network ats-ci redis:8-alpine
          docker run -d --init --name api --network ats-ci -p 127.0.0.1:3000:3000 \
            -e REDIS_URL=redis://redis:6379 ats-api:ci
          docker run -d --init --name worker --network ats-ci \
            -e REDIS_URL=redis://redis:6379 ats-api:ci node dist/main.worker.js
          docker run -d --name web -p 127.0.0.1:8080:8080 ats-web:ci

      - name: API answers /health
        run: |
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 1; done
          exit 1

      - name: Worker processes a ping job
        run: |
          docker run --rm --network ats-ci -e REDIS_URL=redis://redis:6379 ats-api:ci \
            node dist/queue/enqueue-ping.js
          for _ in $(seq 30); do docker logs worker 2>&1 | grep -q '"ping processed"' && exit 0; sleep 1; done
          exit 1

      - name: Web serves the app and deep links
        run: |
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:8080/jobs/123 | grep -q '<div id="app">'

      - name: Containers run as non-root
        run: |
          for name in api worker web; do
            uid=$(docker exec "$name" id -u)
            echo "$name uid=$uid"
            [ "$uid" != 0 ]
          done

      - name: Container logs
        if: failure()
        run: |
          for name in redis api worker web; do echo "::group::$name"; docker logs "$name" || true; echo "::endgroup::"; done
